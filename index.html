<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BROKENtv</title>
    <link href="https://vjs.zencdn.net/8.0.4/video-js.css" rel="stylesheet" />
    <script src="https://vjs.zencdn.net/8.0.4/video.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #0a0a0a;
            --card-bg: #1a1a2e;
            --primary: #9d4edd;
            --accent: #e94560;
            --text: #ffffff;
            --glow: 0 0 25px rgba(157, 78, 221, 0.6);
        }
        * { box-sizing: border-box; }
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(to bottom, #0f0f1e, #0a0a0a);
            color: var(--text);
        }
        body { display: flex; flex-direction: column; }
        header {
            background: rgba(10,10,10,0.95);
            padding: 20px;
            text-align: center;
            font-size: clamp(2rem, 7vw, 3rem);
            font-weight: bold;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            flex-shrink: 0;
            animation: fadeIn 1.5s;
        }

        #search-container {
            padding: 15px 20px;
            background: rgba(0,0,0,0.6);
            flex-shrink: 0;
        }
        #search-input {
            width: 100%;
            padding: 16px 20px 16px 50px;
            border: none;
            border-radius: 30px;
            background: #16213e url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="%23888" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>') no-repeat 18px center;
            color: white;
            font-size: 1.2rem;
            outline: none;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }
        #search-input::placeholder { color: #888; }
        #search-input:focus { box-shadow: var(--glow); }

        #login-screen {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-y: auto;
        }
        #login-form {
            padding: 40px;
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: var(--glow);
            width: 90%;
            max-width: 450px;
            animation: slideUp 1s ease;
        }
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 18px;
            margin: 15px 0;
            border: none;
            border-radius: 12px;
            background: #16213e;
            color: white;
            font-size: 1.2rem;
        }
        button {
            width: 100%;
            padding: 18px;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.3rem;
            cursor: pointer;
            transition: all 0.4s;
        }
        button:hover, button:focus { transform: translateY(-5px); box-shadow: var(--glow); outline: none; }

        #main { display: none; flex: 1; flex-direction: column; overflow: hidden; }

        #content-wrapper {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 10px 0 80px 0;
        }
        #channel-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
            padding: 0 20px;
        }
        @media (min-width: 768px) {
            #channel-grid { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 25px; }
        }
        @media (min-width: 1200px) {
            #channel-grid { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
        }

        .channel-card {
            background: var(--card-bg);
            border-radius: 18px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.4s ease;
            box-shadow: 0 8px 20px rgba(0,0,0,0.6);
            animation: cardIn 0.8s ease forwards;
            opacity: 0;
            transform: scale(0.9);
        }
        .channel-card:hover, .channel-card:focus {
            transform: translateY(-15px) scale(1.06);
            box-shadow: var(--glow), 0 20px 40px rgba(157,78,221,0.4);
            outline: none;
        }
        .channel-logo {
            width: 100%;
            height: 160px; /* Aumentado pra ficar mais visível */
            object-fit: contain;
            background: linear-gradient(135deg, #16213e, #0f0f1e);
            padding: 20px;
            transition: opacity 0.5s;
        }
        .channel-logo.loading {
            opacity: 0.6;
        }
        .channel-name {
            padding: 15px;
            text-align: center;
            font-weight: bold;
            font-size: 1.1rem;
            word-break: break-word;
        }

        #player-container {
            position: fixed;
            inset: 0;
            background: black;
            display: none;
            flex-direction: column;
            z-index: 100;
            animation: fadeIn 0.5s;
        }
        #back-btn {
            position: absolute;
            top: 30px;
            left: 30px;
            background: rgba(0,0,0,0.7);
            padding: 20px;
            border-radius: 50%;
            font-size: 2.5rem;
            z-index: 101;
            transition: all 0.3s;
            border: none;
            color: white;
        }
        #back-btn:hover, #back-btn:focus {
            background: var(--primary);
            transform: scale(1.2);
            box-shadow: var(--glow);
        }
        #current-channel {
            position: absolute;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.8);
            padding: 18px 35px;
            border-radius: 20px;
            font-size: clamp(1.4rem, 5vw, 2rem);
            box-shadow: var(--glow);
            text-align: center;
            max-width: 90%;
            word-break: break-word;
        }

        .spinner {
            border: 6px solid #16213e;
            border-top: 6px solid var(--primary);
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 1s linear infinite;
            margin: 50px auto;
        }
        #loading {
            text-align: center;
            padding: 50px;
        }

        @keyframes fadeIn { from {opacity:0;} to {opacity:1;} }
        @keyframes slideUp { from {transform:translateY(50px); opacity:0;} to {transform:translateY(0); opacity:1;} }
        @keyframes cardIn { to {opacity:1; transform:scale(1);} }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <header>BROKENtv</header>

    <div id="login-screen">
        <form id="login-form">
            <h2 style="text-align:center; margin-bottom:20px; font-size:2rem;">Entre no BROKENtv</h2>
            <input type="text" id="username" placeholder="Usuário" required>
            <input type="password" id="password" placeholder="Senha (qualquer)" required>
            <button type="submit">Entrar</button>
        </form>
    </div>

    <div id="main">
        <div id="search-container">
            <input type="text" id="search-input" placeholder="Pesquisar canal...">
        </div>
        <div id="content-wrapper">
            <div id="loading">
                <div class="spinner"></div>
                <p style="font-size:1.5rem;">Carregando canais e logos...</p>
            </div>
            <div id="channel-grid"></div>
        </div>
    </div>

    <div id="player-container">
        <button id="back-btn" aria-label="Voltar"><i class="fas fa-arrow-left"></i></button>
        <video id="video-player" class="video-js vjs-big-play-centered vjs-fluid" controls preload="auto"></video>
        <div id="current-channel"></div>
    </div>

    <script>
        const playlists = [
           "https://raw.githubusercontent.com/Ramys/Iptv-Brasil-2025/refs/heads/master/CanaisBR01.m3u8"
           "https://gist.githubusercontent.com/Danga1963/b66985de3469f7a7841aabbb3ebf30b4/raw/b0dd8d4abb764f36069cd4055c63a2bab06eba6f/WRP%2520IPTV.m3u"
        ];
        
        let allChannels = [];
        let player;

        // Login
        document.getElementById('login-form').addEventListener('submit', e => {
            e.preventDefault();
            const user = document.getElementById('username').value.trim();
            if (user) {
                localStorage.setItem('brokentv_user', user);
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('main').style.display = 'flex';
                loadAllPlaylists();
            }
        });

        if (localStorage.getItem('brokentv_user')) {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('main').style.display = 'flex';
            loadAllPlaylists();
        }

        async function loadAllPlaylists() {
            document.getElementById('loading').style.display = 'block';
            allChannels = [];

            for (const url of playlists) {
                try {
                    const res = await fetch(url);
                    const text = await res.text();
                    parseM3U(text);
                } catch (err) {
                    console.error(`Erro ao carregar ${url}:`, err);
                }
            }

            // Remove duplicatas por URL
            const unique = [];
            const seen = new Set();
            for (const ch of allChannels) {
                if (!seen.has(ch.url)) {
                    seen.add(ch.url);
                    unique.push(ch);
                }
            }
            allChannels = unique;

            renderChannels(allChannels);
            document.getElementById('loading').style.display = 'none';
        }

        function parseM3U(data) {
            const lines = data.split('\n');
            let current = null;

            for (let line of lines) {
                line = line.trim();
                if (line.startsWith('#EXTINF:')) {
                    const nameMatch = line.match(/,(.+)$/);
                    const logoMatch = line.match(/tvg-logo="([^"]*)"/);

                    current = {
                        name: nameMatch ? nameMatch[1].trim() : 'Canal sem nome',
                        logo: logoMatch && logoMatch[1] ? logoMatch[1].trim() : ''
                    };
                } else if (line.startsWith('http') && current) {
                    current.url = line;
                    allChannels.push(current);
                    current = null;
                }
            }
        }

        // Pesquisa
        document.getElementById('search-input').addEventListener('input', e => {
            const query = e.target.value.toLowerCase().trim();
            if (query === '') {
                renderChannels(allChannels);
            } else {
                const filtered = allChannels.filter(ch => ch.name.toLowerCase().includes(query));
                renderChannels(filtered);
            }
        });

        function renderChannels(channelsToShow) {
            const grid = document.getElementById('channel-grid');
            grid.innerHTML = '';
            channelsToShow.forEach((ch, i) => {
                const card = document.createElement('div');
                card.className = 'channel-card';
                card.tabIndex = 0;
                card.style.animationDelay = `${i * 0.04}s`;

                // Placeholder bonito com as iniciais do canal
                const initials = ch.name.split(' ').map(w => w[0]).join('').substring(0,3).toUpperCase();
                const placeholder = `https://via.placeholder.com/300x160/16213e/ffffff?text=${initials}`;

                card.innerHTML = `
                    <img class="channel-logo loading" src="${ch.logo || placeholder}" 
                         onerror="this.onerror=null; this.src='https:' + this.src.substring(7); if(this.src.includes('https:https')) this.src='${placeholder}';"
                         onload="this.classList.remove('loading')"
                         alt="${ch.name}">
                    <div class="channel-name">${ch.name}</div>
                `;
                card.onclick = card.onkeydown = (e) => {
                    if (e.type === 'keydown' && e.key !== 'Enter' && e.key !== ' ') return;
                    playChannel(ch);
                };
                grid.appendChild(card);
            });
        }

        function playChannel(ch) {
            document.getElementById('player-container').style.display = 'flex';
            document.getElementById('current-channel').textContent = ch.name;

            if (player) player.dispose();
            player = videojs('video-player', { fluid: true, responsive: true, fill: true });

            if (Hls.isSupported() && ch.url.includes('.m3u8')) {
                const hls = new Hls();
                hls.loadSource(ch.url);
                hls.attachMedia(document.querySelector('#video-player_html5_api'));
            } else {
                player.src({ src: ch.url, type: 'application/x-mpegURL' });
            }

            player.ready(() => player.play());
        }

        document.getElementById('back-btn').onclick = () => {
            document.getElementById('player-container').style.display = 'none';
            if (player) player.dispose();
        };
    </script>
</body>
</html>
