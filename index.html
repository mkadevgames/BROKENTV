<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>BrokenTV</title>
<meta name="color-scheme" content="dark">

<style>
  :root {
    --bg: #0f001a;
    --purple: #7c3aed;
    --purple-dark: #5b21b6;
    --purple-glow: #a78bfa;
    --text: #e9d5ff;
    --text-soft: #c4b5fd;
    --card: #1a0033;
  }

  * {
    margin:0;
    padding:0;
    box-sizing: border-box;
  }

  body {
    font-family: system-ui, -apple-system, BlinkMacOSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100dvh;
    background-image: 
      radial-gradient(circle at 15% 50%, rgba(124,58,237,0.12) 0%, transparent 25%),
      radial-gradient(circle at 85% 30%, rgba(167,139,250,0.08) 0%, transparent 35%);
  }

  header {
    padding: 1rem 1.5rem;
    background: linear-gradient(to bottom, rgba(30,10,60,0.7), transparent);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    position: sticky;
    top: 0;
    z-index: 100;
    border-bottom: 1px solid rgba(124,58,237,0.15);
  }

  h1 {
    font-size: 1.8rem;
    font-weight: 700;
    background: linear-gradient(90deg, #c084fc, #a78bfa, #7c3aed);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    display: inline-block;
  }

  .container {
    max-width: 1400px;
    margin: 0 auto;
    padding: 1rem;
  }

  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 1rem;
    margin: 1.5rem 0;
    padding: 1rem;
    background: var(--card);
    border-radius: 16px;
    border: 1px solid rgba(124,58,237,0.2);
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  }

  input[type="url"], input[type="text"], input[type="file"] {
    flex: 1;
    min-width: 220px;
    padding: 0.7rem 1rem;
    border: 1px solid rgba(124,58,237,0.3);
    border-radius: 10px;
    background: rgba(30,10,60,0.4);
    color: var(--text);
    font-size: 0.95rem;
  }

  input:focus {
    outline: none;
    border-color: var(--purple);
    box-shadow: 0 0 0 3px rgba(124,58,237,0.25);
  }

  button {
    padding: 0.7rem 1.4rem;
    border: none;
    border-radius: 10px;
    background: var(--purple);
    color: white;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.25s ease;
  }

  button:hover {
    background: var(--purple-glow);
    transform: translateY(-1px);
    box-shadow: 0 6px 20px rgba(124,58,237,0.4);
  }

  button:active {
    transform: translateY(1px);
  }

  .player-container {
    margin: 2rem 0;
    border-radius: 16px;
    overflow: hidden;
    background: black;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6),
                inset 0 0 60px rgba(124,58,237,0.08);
    position: relative;
    aspect-ratio: 16 / 9;
    max-width: 100%;
  }

  video, audio {
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: #000;
  }

  .playlist {
    margin-top: 1.5rem;
    background: var(--card);
    border-radius: 16px;
    padding: 1.2rem;
    border: 1px solid rgba(124,58,237,0.2);
    max-height: 50vh;
    overflow-y: auto;
  }

  .playlist-item {
    padding: 0.8rem 1rem;
    margin: 0.4rem 0;
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.2s ease;
    background: rgba(30,10,60,0.3);
  }

  .playlist-item:hover,
  .playlist-item.current {
    background: rgba(124,58,237,0.25);
    transform: translateX(6px);
  }

  .playlist-item.current {
    border-left: 4px solid var(--purple);
    font-weight: 600;
  }

  footer {
    text-align: center;
    padding: 2rem;
    color: var(--text-soft);
    font-size: 0.85rem;
    opacity: 0.7;
  }

  @media (max-width: 600px) {
    .controls { flex-direction: column; }
    h1 { font-size: 1.6rem; }
  }
</style>
</head>
<body>

<header>
  <h1>Broken<span style="opacity:0.8">TV</span></h1>
</header>

<div class="container">

  <div class="controls">
    <input type="url" id="m3uUrl" placeholder="Cole a URL da sua lista .m3u / .m3u8" autocomplete="off"/>
    <button onclick="loadM3UFromUrl()">Carregar Lista</button>
    
    <input type="file" id="localFiles" multiple accept="video/*,audio/*,.m3u,.m3u8"/>
    <button onclick="loadLocalFiles()">Adicionar arquivos locais</button>
  </div>

  <div class="player-container">
    <video id="mainPlayer" controls autoplay></video>
    <!-- <audio id="mainPlayer" controls></audio> → descomente se quiser usar só áudio -->
  </div>

  <div class="playlist" id="playlist">
    <div style="opacity:0.6; padding:1rem; text-align:center;">
      Carregue uma lista ou arquivos para começar...
    </div>
  </div>

</div>

<footer>
  BrokenTV • LocalStorage • 2025–2026
</footer>

<script>
// =============================================
// BrokenTV - Mini player com M3U + local files
// =============================================

const player = document.getElementById('mainPlayer');
const playlistEl = document.getElementById('playlist');
let currentPlaylist = [];
let currentIndex = -1;

const STORAGE_KEY = 'brokenTV_lastState';

// Carrega estado anterior
function loadLastState() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (!saved) return;
    
    const data = JSON.parse(saved);
    currentPlaylist = data.playlist || [];
    currentIndex = data.index || -1;

    if (currentPlaylist.length > 0) {
      renderPlaylist();
      if (currentIndex >= 0 && currentIndex < currentPlaylist.length) {
        playItem(currentIndex);
      }
    }
  } catch(e) {}
}

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      playlist: currentPlaylist,
      index: currentIndex
    }));
  } catch(e) {}
}

function renderPlaylist() {
  playlistEl.innerHTML = '';
  
  if (currentPlaylist.length === 0) {
    playlistEl.innerHTML = '<div style="opacity:0.6;padding:2rem;text-align:center;">Nenhum item na playlist...</div>';
    return;
  }

  currentPlaylist.forEach((item, i) => {
    const div = document.createElement('div');
    div.className = 'playlist-item';
    if (i === currentIndex) div.classList.add('current');
    
    div.textContent = item.name || item.url.split('/').pop() || 'Sem título';
    div.title = item.url;
    
    div.onclick = () => playItem(i);
    playlistEl.appendChild(div);
  });
}

function playItem(index) {
  if (index < 0 || index >= currentPlaylist.length) return;
  
  currentIndex = index;
  renderPlaylist();
  
  const item = currentPlaylist[index];
  player.src = item.url;
  player.title = item.name || 'Reproduzindo...';
  
  player.play().catch(e => console.log("Autoplay bloqueado:", e));
  
  saveState();
}

player.onended = () => {
  if (currentIndex < currentPlaylist.length - 1) {
    playItem(currentIndex + 1);
  }
};

// ======================
//  CARREGAR M3U via URL
// ======================
async function loadM3UFromUrl() {
  const url = document.getElementById('m3uUrl').value.trim();
  if (!url) return alert('Digite uma URL válida!');

  try {
    const response = await fetch(url);
    if (!response.ok) throw new Error('Falha ao carregar lista');
    
    const text = await response.text();
    parseAndLoadM3U(text, url);
    
  } catch(e) {
    alert('Erro ao carregar a lista M3U:\n' + e.message);
  }
}

// ======================
//  PARSE M3U (simples)
// ======================
function parseAndLoadM3U(text, baseUrl = '') {
  const lines = text.split('\n').map(l => l.trim());
  const items = [];
  
  let currentName = null;

  for (const line of lines) {
    if (line.startsWith('#EXTINF')) {
      // tenta pegar nome (bem simples)
      const nameMatch = line.match(/,(.+)/);
      currentName = nameMatch ? nameMatch[1].trim() : null;
    }
    else if (line && !line.startsWith('#')) {
      let finalUrl = line;
      if (!line.startsWith('http') && baseUrl) {
        try {
          finalUrl = new URL(line, baseUrl).href;
        } catch(_) {}
      }
      
      items.push({
        name: currentName || finalUrl.split('/').pop(),
        url: finalUrl
      });
      currentName = null;
    }
  }

  if (items.length > 0) {
    currentPlaylist = items;
    currentIndex = 0;
    renderPlaylist();
    playItem(0);
    saveState();
  } else {
    alert('Nenhum canal válido encontrado na lista :(');
  }
}

// ======================
//  ARQUIVOS LOCAIS
// ======================
function loadLocalFiles() {
  const input = document.getElementById('localFiles');
  const files = input.files;
  
  if (!files?.length) return;

  const newItems = Array.from(files).map(file => ({
    name: file.name,
    url: URL.createObjectURL(file)
  }));

  // Adiciona no final da playlist atual
  currentPlaylist = [...currentPlaylist, ...newItems];
  
  if (currentIndex === -1 && currentPlaylist.length > 0) {
    currentIndex = 0;
  }

  renderPlaylist();
  saveState();

  // limpa input
  input.value = '';
}

// Inicialização
loadLastState();

// Teclas rápidas (opcional)
document.addEventListener('keydown', e => {
  if (e.code === 'ArrowRight' && currentIndex < currentPlaylist.length - 1) {
    playItem(currentIndex + 1);
  }
  if (e.code === 'ArrowLeft' && currentIndex > 0) {
    playItem(currentIndex - 1);
  }
});
</script>
</body>
</html>
