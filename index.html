<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Broken TV</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        :root {
            --bg: #000;
            --primary: #E50914;
            --text: #fff;
            --card: #141414;
        }
        body {
            margin: 0;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }
        header {
            background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 10;
            box-sizing: border-box;
        }
        .logo {
            font-size: 2.5rem;
            font-weight: bold;
            color: var(--primary);
        }
        .search {
            padding: 10px;
            width: 300px;
            max-width: 100%;
            border: none;
            border-radius: 4px;
            background: #333;
            color: white;
        }
        .profile {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .avatar {
            width: 40px;
            height: 40px;
            background: var(--primary);
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }
        main {
            margin-top: 80px;
            padding: 20px;
        }
        .section {
            margin-bottom: 60px;
        }
        h2 {
            margin-bottom: 20px;
            font-size: 1.8rem;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 15px;
        }
        .channel-card {
            background: var(--card);
            padding: 20px;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.3s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .channel-card:hover {
            transform: scale(1.05);
        }
        .channel-name {
            font-size: 1.2rem;
        }
        .favorite {
            font-size: 1.5rem;
            cursor: pointer;
        }
        .favorite.active {
            color: var(--primary);
        }
        #player-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: black;
            z-index: 20;
            display: none;
            flex-direction: column;
        }
        #video {
            width: 100%;
            height: 100%;
        }
        #close-player {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 2rem;
            cursor: pointer;
            color: white;
            z-index: 30;
        }
        #login-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 50;
        }
        #login-screen input {
            padding: 15px;
            width: 300px;
            max-width: 90%;
            margin: 20px;
            font-size: 1.2rem;
            border-radius: 4px;
            border: none;
        }
        #login-screen button {
            padding: 15px 30px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 1.2rem;
            cursor: pointer;
        }
        @media (max-width: 768px) {
            .grid {
                grid-template-columns: 1fr 1fr;
            }
            .search {
                width: 200px;
            }
        }
    </style>
</head>
<body>

    <div id="login-screen">
        <h1 class="logo">Broken TV</h1>
        <input type="text" id="profile-name" placeholder="Digite seu nome de perfil">
        <button onclick="login()">Entrar</button>
    </div>

    <header>
        <div class="logo">Broken TV</div>
        <input type="text" class="search" id="search" placeholder="Pesquisar canais...">
        <div class="profile">
            <div class="avatar" id="avatar"></div>
            <span id="profile-name-header"></span>
        </div>
    </header>

    <main id="main-content" style="display:none;">
        <div id="player-container">
            <div id="close-player" onclick="closePlayer()">✖</div>
            <video id="video" controls autoplay></video>
        </div>

        <div class="section">
            <h2>Favoritos</h2>
            <div class="grid" id="favorites-grid"></div>
        </div>

        <div id="categories"></div>
    </main>

    <script>
        const playlistUrl = 'https://raw.githubusercontent.com/Ramys/Iptv-Brasil-2025/refs/heads/master/CanaisBR01.m3u8';
        let channels = [];
        let favorites = [];
        let currentProfile = '';

        function login() {
            const name = document.getElementById('profile-name').value.trim() || 'Usuário';
            currentProfile = name;
            localStorage.setItem('brokenTvProfile', name);

            const savedFavs = localStorage.getItem('brokenTvFavorites_' + name);
            favorites = savedFavs ? JSON.parse(savedFavs) : [];

            document.getElementById('avatar').textContent = name[0].toUpperCase();
            document.getElementById('profile-name-header').textContent = name;
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('main-content').style.display = 'block';

            loadPlaylist();
        }

        if (localStorage.getItem('brokenTvProfile')) {
            currentProfile = localStorage.getItem('brokenTvProfile');
            document.getElementById('profile-name').value = currentProfile;
            login();
        }

        async function loadPlaylist() {
            try {
                const response = await fetch(playlistUrl);
                const text = await response.text();
                channels = parseM3U(text);
                renderChannels();
            } catch (e) {
                alert('Erro ao carregar a playlist. Tente novamente mais tarde.');
            }
        }

        function parseM3U(text) {
            const lines = text.split('\n');
            const result = [];
            let current = null;

            for (let line of lines) {
                line = line.trim();
                if (line.startsWith('#EXTINF:')) {
                    const nameMatch = line.match(/,(.+)$/);
                    const groupMatch = line.match(/group-title="([^"]+)"/);
                    current = {
                        name: nameMatch ? nameMatch[1].trim() : 'Canal Sem Nome',
                        group: groupMatch ? groupMatch[1] : 'Outros',
                        url: ''
                    };
                } else if (line && !line.startsWith('#') && current) {
                    current.url = line;
                    if (current.url) result.push(current);
                    current = null;
                }
            }
            return result;
        }

        function renderChannels() {
            const categoriesDiv = document.getElementById('categories');
            categoriesDiv.innerHTML = '';

            // Favoritos primeiro
            renderGrid(document.getElementById('favorites-grid'), channels.filter(ch => favorites.includes(ch.url)));

            // Por categoria
            const groups = [...new Set(channels.map(ch => ch.group))].sort();
            groups.forEach(group => {
                const groupChannels = channels.filter(ch => ch.group === group);
                if (groupChannels.length === 0) return;

                const section = document.createElement('div');
                section.className = 'section';
                section.innerHTML = `<h2>${group}</h2><div class="grid" data-group="${group}"></div>`;
                categoriesDiv.appendChild(section);

                renderGrid(section.querySelector('.grid'), groupChannels);
            });

            setupSearch();
        }

        function renderGrid(grid, channelList) {
            grid.innerHTML = '';
            channelList.forEach(channel => {
                const card = document.createElement('div');
                card.className = 'channel-card';
                card.innerHTML = `
                    <div class="channel-name">${channel.name}</div>
                    <span class="favorite ${favorites.includes(channel.url) ? 'active' : ''}" onclick="toggleFavorite('${channel.url.replace(/'/g, "\\'")}', event)">♥</span>
                `;
                card.onclick = (e) => {
                    if (!e.target.classList.contains('favorite')) playChannel(channel.url);
                };
                grid.appendChild(card);
            });
        }

        function toggleFavorite(url, event) {
            event.stopPropagation();
            if (favorites.includes(url)) {
                favorites = favorites.filter(f => f !== url);
            } else {
                favorites.push(url);
            }
            localStorage.setItem('brokenTvFavorites_' + currentProfile, JSON.stringify(favorites));
            renderChannels(); // atualiza tudo
        }

        function setupSearch() {
            document.getElementById('search').addEventListener('input', (e) => {
                const term = e.target.value.toLowerCase();
                document.querySelectorAll('.grid').forEach(grid => {
                    const cards = grid.querySelectorAll('.channel-card');
                    cards.forEach(card => {
                        const name = card.querySelector('.channel-name').textContent.toLowerCase();
                        card.style.display = name.includes(term) ? 'flex' : 'none';
                    });
                });
            });
        }

        let currentHls = null;
        function playChannel(url) {
            document.getElementById('player-container').style.display = 'flex';
            const video = document.getElementById('video');

            if (Hls.isSupported()) {
                if (currentHls) currentHls.destroy();
                currentHls = new Hls();
                currentHls.loadSource(url);
                currentHls.attachMedia(video);
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = url;
            } else {
                alert('Seu navegador não suporta reprodução HLS. Use um app IPTV externo ou navegador mais novo.');
            }
        }

        function closePlayer() {
            document.getElementById('player-container').style.display = 'none';
            if (currentHls) {
                currentHls.destroy();
                currentHls = null;
            }
            document.getElementById('video').src = '';
        }
    </script>
</body>
</html>
