<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BROKEN TV - Filmes, Séries e Animes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <style>
        body {
            background-color: #141414;
            color: white;
        }
        .navbar {
            background-color: #000;
        }
        .card {
            background-color: #333;
            border: none;
        }
        .card-img-top {
            height: 200px;
            object-fit: cover;
        }
        .favorite {
            color: red;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">NinjaFlix</a>
            <form class="d-flex mx-auto" id="searchForm">
                <input class="form-control me-2" type="search" placeholder="Pesquisar" aria-label="Search" id="searchInput">
                <button class="btn btn-outline-light" type="submit">Buscar</button>
            </form>
            <div>
                <button class="btn btn-outline-light" id="loginBtn">Login</button>
                <span id="userName" class="ms-2"></span>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h2 id="title">Carregando...</h2>
        <p id="description"></p>
        <div class="row" id="contentRow"></div>
    </div>

    <!-- Modal for Login -->
    <div class="modal fade" id="loginModal" tabindex="-1" aria-labelledby="loginModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content bg-dark text-white">
                <div class="modal-header">
                    <h5 class="modal-title" id="loginModalLabel">Login / Cadastro</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="loginForm">
                        <div class="mb-3">
                            <label for="username" class="form-label">Usuário</label>
                            <input type="text" class="form-control" id="username" required>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Senha</label>
                            <input type="password" class="form-control" id="password" required>
                        </div>
                        <button type="submit" class="btn btn-primary">Entrar</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script>
        const REPO_URL = 'https://plugins.ninjaflix.org/repo.json';
        let plugins = [];
        let favorites = JSON.parse(localStorage.getItem('favorites')) || [];
        let currentUser = localStorage.getItem('currentUser');

        function displayContent(filteredPlugins = plugins) {
            const row = document.getElementById('contentRow');
            row.innerHTML = '';
            filteredPlugins.forEach(plugin => {
                const col = document.createElement('div');
                col.className = 'col-md-3 mb-4';
                const card = document.createElement('div');
                card.className = 'card';
                const img = document.createElement('img');
                img.src = plugin.logo || 'https://via.placeholder.com/300x200?text=' + plugin.name; // Assume logo if available
                img.className = 'card-img-top';
                const body = document.createElement('div');
                body.className = 'card-body';
                const title = document.createElement('h5');
                title.className = 'card-title';
                title.textContent = plugin.name || 'Sem Nome';
                const desc = document.createElement('p');
                desc.className = 'card-text';
                desc.textContent = plugin.description || 'Sem Descrição';
                const favBtn = document.createElement('button');
                favBtn.className = 'btn btn-sm ' + (favorites.includes(plugin.name) ? 'btn-danger' : 'btn-outline-light');
                favBtn.innerHTML = favorites.includes(plugin.name) ? '<span class="favorite">❤️</span>' : '❤️';
                favBtn.onclick = () => toggleFavorite(plugin.name, favBtn);
                body.appendChild(title);
                body.appendChild(desc);
                body.appendChild(favBtn);
                card.appendChild(img);
                card.appendChild(body);
                col.appendChild(card);
                row.appendChild(col);
            });
        }

        function toggleFavorite(name, btn) {
            if (!currentUser) {
                alert('Faça login para adicionar favoritos.');
                return;
            }
            const index = favorites.indexOf(name);
            if (index > -1) {
                favorites.splice(index, 1);
                btn.className = 'btn btn-sm btn-outline-light';
                btn.innerHTML = '❤️';
            } else {
                favorites.push(name);
                btn.className = 'btn btn-sm btn-danger';
                btn.innerHTML = '<span class="favorite">❤️</span>';
            }
            localStorage.setItem('favorites', JSON.stringify(favorites));
        }

        function loadData() {
            fetch(REPO_URL)
                .then(response => response.json())
                .then(repo => {
                    document.getElementById('title').textContent = repo.name;
                    document.getElementById('description').textContent = repo.description;
                    const pluginListUrl = repo.pluginLists[0];
                    if (pluginListUrl) {
                        fetch(pluginListUrl)
                            .then(res => res.json())
                            .then(data => {
                                plugins = data.plugins || []; // Assume structure {plugins: [...]}
                                displayContent();
                            })
                            .catch(err => {
                                console.error('Erro ao carregar plugins:', err);
                                document.getElementById('contentRow').innerHTML = '<p>Erro ao carregar conteúdo. Verifique a URL dos plugins.</p>';
                            });
                    }
                })
                .catch(err => {
                    console.error('Erro ao carregar repo:', err);
                    document.getElementById('title').textContent = 'Erro ao carregar';
                });
        }

        document.getElementById('searchForm').addEventListener('submit', e => {
            e.preventDefault();
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = plugins.filter(p => p.name.toLowerCase().includes(query) || (p.description && p.description.toLowerCase().includes(query)));
            displayContent(filtered);
        });

        const loginModal = new bootstrap.Modal(document.getElementById('loginModal'));
        document.getElementById('loginBtn').addEventListener('click', () => loginModal.show());

        document.getElementById('loginForm').addEventListener('submit', e => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            // Simple check, in real would hash etc., but local only
            const storedPass = localStorage.getItem(`user_${username}`);
            if (storedPass) {
                if (storedPass === password) {
                    currentUser = username;
                    localStorage.setItem('currentUser', username);
                    document.getElementById('userName').textContent = `Olá, ${username}`;
                    document.getElementById('loginBtn').textContent = 'Logout';
                    document.getElementById('loginBtn').onclick = logout;
                    favorites = JSON.parse(localStorage.getItem(`favorites_${username}`)) || [];
                    displayContent();
                    loginModal.hide();
                } else {
                    alert('Senha incorreta.');
                }
            } else {
                localStorage.setItem(`user_${username}`, password);
                currentUser = username;
                localStorage.setItem('currentUser', username);
                document.getElementById('userName').textContent = `Olá, ${username}`;
                document.getElementById('loginBtn').textContent = 'Logout';
                document.getElementById('loginBtn').onclick = logout;
                favorites = [];
                localStorage.setItem(`favorites_${username}`, JSON.stringify(favorites));
                displayContent();
                loginModal.hide();
            }
        });

        function logout() {
            localStorage.setItem(`favorites_${currentUser}`, JSON.stringify(favorites));
            localStorage.removeItem('currentUser');
            currentUser = null;
            document.getElementById('userName').textContent = '';
            document.getElementById('loginBtn').textContent = 'Login';
            document.getElementById('loginBtn').onclick = () => loginModal.show();
            favorites = [];
            displayContent();
        }

        if (currentUser) {
            document.getElementById('userName').textContent = `Olá, ${currentUser}`;
            document.getElementById('loginBtn').textContent = 'Logout';
            document.getElementById('loginBtn').onclick = logout;
            favorites = JSON.parse(localStorage.getItem(`favorites_${currentUser}`)) || [];
        }

        loadData();
    </script>
</body>
</html>
